name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Upload resolved dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile
          path: package-lock.json
          retention-days: 1
      - name: Run automated tests
        run: npm test
      - name: Build production app
        run: npm run build
