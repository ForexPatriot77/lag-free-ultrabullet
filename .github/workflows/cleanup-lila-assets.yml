name: Remove assets without redistribution clearance

on:
  push:
    branches: [lila-import]
    paths:
      - .github/workflows/cleanup-lila-assets.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lila-import
          fetch-depth: 1
      - name: Remove unapproved sound collections
        shell: bash
        run: |
          set -euo pipefail
          allowed=' futuristic nes piano sfx '
          for path in public/sound/*; do
            [ -e "$path" ] || continue
            name=$(basename "$path")
            case "$allowed" in
              *" $name "*) ;;
              *) rm -rf "$path" ;;
            esac
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Exclude sound assets without redistribution clearance [skip ci]"
          git push origin HEAD:lila-import
